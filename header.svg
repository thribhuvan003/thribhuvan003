<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop stop-color="#0D1117"></stop>
      <stop offset="1" stop-color="#111827"></stop>
    </linearGradient>

    <linearGradient id="line" x1="180" y1="0" x2="1020" y2="0">
      <stop stop-color="#58A6FF" stop-opacity="0"></stop>
      <stop offset="0.5" stop-color="#58A6FF"></stop>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"></rect>

  <!-- subtle grid -->
  <g opacity="0.08">
    <path d="M0 60H1200" stroke="#8B949E"></path>
    <path d="M0 120H1200" stroke="#8B949E"></path>
    <path d="M0 180H1200" stroke="#8B949E"></path>
    <path d="M0 240H1200" stroke="#8B949E"></path>
    <path d="M0 300H1200" stroke="#8B949E"></path>

    <path d="M120 0V360" stroke="#8B949E"></path>
    <path d="M240 0V360" stroke="#8B949E"></path>
    <path d="M360 0V360" stroke="#8B949E"></path>
    <path d="M480 0V360" stroke="#8B949E"></path>
    <path d="M600 0V360" stroke="#8B949E"></path>
    <path d="M720 0V360" stroke="#8B949E"></path>
    <path d="M840 0V360" stroke="#8B949E"></path>
    <path d="M960 0V360" stroke="#8B949E"></path>
    <path d="M1080 0V360" stroke="#8B949E"></path>
  </g>

  <!-- glow -->
  <ellipse cx="600" cy="185" rx="290" ry="80" fill="#1F6FEB" opacity="0.12" filter="url(#glow)"></ellipse>

  <!-- name -->
  <text x="600" y="105" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="6" text-anchor="middle">
    THRIBHUVAN
  </text>

  <!-- main statement -->
  <text x="600" y="175" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    I build things.
  </text>

  <text x="600" y="225" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    Then I get curious when they break.
  </text>

  <!-- accent -->
  <rect x="330" y="260" width="540" height="2" rx="1" fill="url(#line)"></rect>

  <!-- secondary statement -->
  <text x="600" y="305" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
    sometimes the fix ends up upstream.
  </text>

  <!-- terminal dots -->
  <circle cx="38" cy="35" r="5" fill="#F85149"></circle>
  <circle cx="57" cy="35" r="5" fill="#D29922"></circle>
  <circle cx="76" cy="35" r="5" fill="#3FB950"></circle>
</svg>